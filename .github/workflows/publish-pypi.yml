# Publica o pacote Python (pasta python/) no PyPI a cada tag py-vX.Y.Z, via
# Trusted Publishing (OIDC), sem token. A tag precisa bater com a versão do
# python/pyproject.toml e do __version__. Configuração única no PyPI (o projeto
# ainda não existe, então é um "pending publisher"): Account settings →
# Publishing → Add a new pending publisher → GitHub: project "validador-ie",
# owner "fiscaIapi", repo "validador-ie", workflow "publish-pypi.yml",
# environment "pypi".
name: Publish PyPI

on:
  push:
    tags: ['py-v*.*.*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confere a tag com a versão do pacote
        run: |
          tag="${GITHUB_REF_NAME#py-v}"
          proj=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mod=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('validador_ie/__init__.py').read()).group(1))")
          echo "tag=$tag pyproject=$proj __version__=$mod"
          [ "$tag" = "$proj" ] && [ "$tag" = "$mod" ]
      - name: Testa e gera sdist e wheel
        run: |
          python -m pip install --upgrade build pytest
          python -m pytest -q
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
