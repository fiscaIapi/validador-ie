# Publica o pacote Python (pasta python/) no PyPI a cada tag py-vX.Y.Z, via
# Trusted Publishing (OIDC), sem token. Configuração no PyPI: publisher GitHub com
# owner "fiscaIapi", repo "validador-ie", workflow "publish-pypi.yml", environment "pypi".
name: Publish PyPI

on:
  push:
    tags: ['py-v*.*.*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testa e gera sdist e wheel
        run: |
          python -m pip install --upgrade build pytest
          python -m pytest -q
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
